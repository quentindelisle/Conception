<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="apple-mobile-web-app-title" content="Fabrique N'EPS">
<link rel="manifest" href="manifest.webmanifest">

<body>
<header id="topbar">

  </aside>
</div>
<div id="signature"><b>Quentin Delisle</b> · N'EPS</div>
<div id="fab-version" class="fab-version"></div>
<div id="toast" role="status" aria-live="polite"></div>
